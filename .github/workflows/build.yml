name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 16 * * *" # 23:00 Asia/Saigon
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  supported:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        flavor: [cli, fpm]
    steps:
      - uses: actions/checkout@v4

      - uses: abxst/actions/strict@v3
        with:
          push: ${{ github.event_name != 'pull_request' }}
          image-name: ${{ github.repository }}-${{ matrix.php }}-${{ matrix.flavor }}
          dockerfile: ./Dockerfile
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            PHP_FLAVOR=${{ matrix.flavor }}
            CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}
          platforms: linux/amd64,linux/arm64
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
