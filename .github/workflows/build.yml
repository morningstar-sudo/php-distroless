name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 16 * * *" # 23:00 Asia/Saigon
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # Build and scan AMD64 images on Ubuntu 24.04.
  # Publish immutable digests before applying latest and <sha>-<date> tags.
  supported:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        flavor: [cli, fpm]
    env:
      BUILD_ARGS: |
        PHP_VERSION=${{ matrix.php }}
        PHP_FLAVOR=${{ matrix.flavor }}
        CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image for scan
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: ${{ env.BUILD_ARGS }}
          platforms: linux/amd64
          load: true
          tags: local/php-scan:${{ matrix.php }}-${{ matrix.flavor }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Vulnerability gate (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local/php-scan:${{ matrix.php }}-${{ matrix.flavor }}
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

      - name: Login to GHCR
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push by digest
        id: push
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: ${{ env.BUILD_ARGS }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=ghcr.io/${{ github.repository }}-${{ matrix.php }}-${{ matrix.flavor }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha

      - name: Export digest
        if: steps.push.outputs.digest != ''
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        if: steps.push.outputs.digest != ''
        with:
          name: digests-${{ matrix.php }}-${{ matrix.flavor }}-amd64
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: supported
    # Allow successful variants to publish when another matrix cell fails.
    if: ${{ !cancelled() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        flavor: [cli, fpm]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.php }}-${{ matrix.flavor }}-*
          path: digests
          merge-multiple: true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create AMD64 manifest
        id: manifest
        env:
          NAME: ghcr.io/${{ github.repository }}-${{ matrix.php }}-${{ matrix.flavor }}
        run: |
          set -euo pipefail
          image="${NAME,,}"
          tags=("${image}:${GITHUB_SHA::7}-$(date -u +%d%m%Y)" "${image}:latest")
          sources=()
          for file in digests/*; do
            test -f "${file}"
            sources+=("${image}@sha256:${file##*/}")
          done
          test "${#sources[@]}" -eq 1
          docker buildx imagetools create "${tags[@]/#/--tag=}" "${sources[@]}"
          digest="$(docker buildx imagetools inspect "${tags[0]}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.4

      - uses: anchore/sbom-action/download-syft@v0

      - name: Sign image and attest SBOM
        env:
          IMAGE: ${{ steps.manifest.outputs.image }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          # Sigstore and GHCR fail transiently; retry each network call.
          retry() {
            local attempt
            for attempt in 1 2 3; do
              if "$@"; then
                return 0
              fi
              if (( attempt < 3 )); then
                echo "attempt ${attempt} failed, retrying: $1" >&2
                sleep $(( attempt * 20 ))
              fi
            done
            return 1
          }
          platform_digests="$(retry docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}" |
            jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest')"
          for digest in ${platform_digests}; do
            retry syft "${IMAGE}@${digest}" -o spdx-json=sbom.spdx.json
            retry cosign attest --yes \
              --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${digest}"
            retry cosign sign --yes --registry-referrers-mode=legacy "${IMAGE}@${digest}"
          done
          retry cosign sign --yes --registry-referrers-mode=legacy "${IMAGE}@${DIGEST}"
