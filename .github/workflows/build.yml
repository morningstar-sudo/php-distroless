name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 16 * * *" # 23:00 Asia/Saigon
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  supported:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        flavor: [cli, fpm]
    steps:
      - uses: actions/checkout@v4

      - uses: abxst/actions/strict@v3
        id: build
        with:
          push: ${{ github.event_name != 'pull_request' }}
          image-name: ${{ github.repository }}-${{ matrix.php }}-${{ matrix.flavor }}
          dockerfile: ./Dockerfile
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            PHP_FLAVOR=${{ matrix.flavor }}
            CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}
          platforms: linux/amd64,linux/arm64
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v4.1.2
        if: steps.build.outputs.image-digest != ''
        with:
          cosign-release: v3.1.4

      - uses: anchore/sbom-action/download-syft@v0
        if: steps.build.outputs.image-digest != ''

      - name: Sign image and attest SBOM
        if: steps.build.outputs.image-digest != ''
        env:
          IMAGE: ghcr.io/${{ steps.build.outputs.image-name-lc }}
          DIGEST: ${{ steps.build.outputs.image-digest }}
        run: |
          set -euo pipefail
          platform_digests="$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}" |
            jq -r '.manifests[]? | select(.platform.os == "linux") | .digest')"
          for digest in ${platform_digests:-${DIGEST}}; do
            syft "${IMAGE}@${digest}" -o spdx-json=sbom.spdx.json
            cosign attest --yes --registry-referrers-mode=legacy \
              --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${digest}"
            cosign sign --yes --registry-referrers-mode=legacy "${IMAGE}@${digest}"
          done
          if [ -n "${platform_digests}" ]; then
            cosign sign --yes --registry-referrers-mode=legacy "${IMAGE}@${DIGEST}"
          fi
